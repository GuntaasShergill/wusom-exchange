name: Deploy WUSOMExchange

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CDK deps
        working-directory: cdk
        run: |
          pip install -r requirements.txt
          npm install -g aws-cdk
      - name: Lambda syntax check
        run: python -m py_compile lambda/*/handler.py
      - name: CDK synth (sanity check, no AWS creds needed)
        working-directory: cdk
        run: cdk synth -c stage=staging --no-lookups

  deploy-staging:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Install CDK deps
        working-directory: cdk
        run: |
          pip install -r requirements.txt
          npm install -g aws-cdk
      - name: Deploy staging stack
        working-directory: cdk
        run: cdk deploy -c stage=staging --require-approval never --outputs-file outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-outputs
          path: cdk/outputs.json

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Install CDK deps
        working-directory: cdk
        run: |
          pip install -r requirements.txt
          npm install -g aws-cdk
      - name: Deploy prod stack
        working-directory: cdk
        run: cdk deploy -c stage=prod --require-approval never --outputs-file outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: prod-outputs
          path: cdk/outputs.json
